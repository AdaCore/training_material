<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">

  <defs>
    <marker id="arrow-cyan" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 z" fill="#F87171" />
    </marker>
  </defs>

  <!-- Background card -->
  <rect width="920" height="440" rx="10" ry="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="460" y="42" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F8FAFC" letter-spacing="0.5">Anatomy of an Interleaving Failure: The Lost Update</text>

  <!-- Column Header: Foreground -->
  <rect x="40" y="70" width="370" height="34" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
  <text x="225" y="92" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="13" fill="#38BDF8">FOREGROUND (COUNT += 1)</text>

  <!-- Column Header: Interrupt -->
  <rect x="510" y="70" width="370" height="34" rx="6" fill="#1E293B" stroke="#DC2626" stroke-width="1.5" />
  <text x="695" y="92" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="13" fill="#F87171">INTERRUPT (COUNT = 0)</text>

  <!-- Center Shared Variable Track -->
  <line x1="460" y1="120" x2="460" y2="380" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Step 1: Foreground loads 3 -->
  <rect x="50" y="125" width="350" height="48" rx="6" fill="#0F243A" stroke="#0284C7" stroke-width="1" />
  <text x="65" y="145" font-family="monospace" font-size="12" fill="#E2E8F0">1. CPU Load: R0 = COUNT</text>
  <text x="65" y="162" font-family="sans-serif" font-size="11" fill="#94A3B8">Observed value: 3 (held in private CPU register R0)</text>

  <!-- Step 2: Foreground Increments Locally -->
  <rect x="50" y="185" width="350" height="48" rx="6" fill="#0F243A" stroke="#0284C7" stroke-width="1" />
  <text x="65" y="205" font-family="monospace" font-size="12" fill="#E2E8F0">2. CPU Add:  R0 = R0 + 1</text>
  <text x="65" y="222" font-family="sans-serif" font-size="11" fill="#94A3B8">Register R0 is now 4 (NOT written to RAM yet!)</text>

  <!-- PREEMPTION EVENT (Horizontal Indicator) -->
  <line x1="120" y1="254" x2="800" y2="254" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,4" />
  <text x="460" y="247" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#F87171">[ Hardware Preemption Occurs Here ]</text>

  <!-- Step 3: ISR Clears Count -->
  <rect x="520" y="260" width="350" height="52" rx="6" fill="#2A1215" stroke="#DC2626" stroke-width="1.5" />
  <text x="535" y="282" font-family="monospace" font-size="12" fill="#FCA5A5">3. ISR Store: COUNT = 0</text>
  <text x="535" y="300" font-family="sans-serif" font-size="11" fill="#FCA5A5">Reset applied: COUNT in RAM is now 0</text>

  <!-- Step 4: ISR Exits, Foreground Resumes and Overwrites -->
  <rect x="50" y="325" width="350" height="52" rx="6" fill="#3B1219" stroke="#EF4444" stroke-width="1.8" />
  <text x="65" y="347" font-family="monospace" font-weight="bold" font-size="12" fill="#FCA5A5">4. CPU Store: COUNT = R0</text>
  <text x="65" y="365" font-family="sans-serif" font-size="11" fill="#F87171">Writes stale R0 (4) to RAM: Reset is permanently lost!</text>

  <!-- Arrows connecting sequence -->
  <path d="M 225 173 L 225 183" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <path d="M 225 233 C 225 260, 500 260, 518 280" fill="none" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 695 312 C 695 340, 420 340, 402 345" fill="none" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Final Outcome Callout Box -->
  <rect x="250" y="392" width="420" height="34" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1" />
  <text x="460" y="414" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FECACA">Result: COUNT = 4 (Defined assembly steps, corrupt outcome)</text>

</svg>