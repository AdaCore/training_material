<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Build-time linking and a runtime C ABI call</title>
  <desc id="desc">Static linking example. Rust source is compiled into Rust object code. The linker combines Rust object code with compiled C objects or a static library into one executable. At runtime, the Rust caller invokes the C function already linked into that executable using the C ABI, then receives a result.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
  </defs>

  <!-- Two phases of the same statically linked executable -->
  <text x="300" y="45" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#1C3553">Build time (static linking)</text>
  <text x="910" y="45" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#1C3553">Runtime</text>
  <line x1="605" y1="28" x2="605" y2="592" stroke="#B8D5E6" stroke-width="2"/>
  <line x1="57" y1="68" x2="567" y2="68" stroke="#B8D5E6" stroke-width="2"/>
  <line x1="647" y1="68" x2="1150" y2="68" stroke="#B8D5E6" stroke-width="2"/>

  <!-- Build time: compile Rust, then link Rust and C object code -->
  <rect x="70" y="101" width="210" height="70" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5"/>
  <text x="175" y="144" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#1C3553">Rust source</text>

  <line x1="175" y1="171" x2="175" y2="213" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="195" y="198" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#526B82">compile</text>

  <rect x="53" y="216" width="244" height="78" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5"/>
  <text x="175" y="263" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#1C3553">Rust object code</text>

  <rect x="335" y="216" width="230" height="78" rx="14" fill="#E9F2F8" stroke="#17345F" stroke-width="2.5"/>
  <text x="450" y="249" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#1C3553">C object code</text>
  <text x="450" y="277" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#1C3553">or static library</text>

  <path d="M 175 294 L 175 331 L 268 331 L 268 363" fill="none" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <path d="M 450 294 L 450 331 L 370 331 L 370 363" fill="none" stroke="#17345F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-navy)"/>
  <rect x="199" y="365" width="240" height="70" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5"/>
  <text x="319" y="408" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="600" fill="#1C3553">Linker</text>

  <line x1="319" y1="435" x2="319" y2="485" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="199" y="488" width="240" height="70" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5"/>
  <text x="319" y="517" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#356943">Executable</text>
  <text x="319" y="543" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#356943">Rust + C code</text>

  <!-- Runtime: Rust and C functions live inside the same executable -->
  <rect x="684" y="102" width="468" height="484" rx="19" fill="#F5F8FB" stroke="#B8D5E6" stroke-width="2.5"/>
  <text x="918" y="144" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#1C3553">Running executable</text>
  <line x1="724" y1="163" x2="1112" y2="163" stroke="#B8D5E6" stroke-width="2"/>

  <rect x="747" y="187" width="342" height="68" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5"/>
  <text x="918" y="230" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#1C3553">Rust caller</text>

  <line x1="918" y1="255" x2="918" y2="336" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="818" y="282" width="200" height="40" rx="20" fill="#FFFFFF" stroke="#17345F" stroke-width="2"/>
  <text x="918" y="308" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">C ABI call</text>

  <rect x="747" y="339" width="342" height="83" rx="14" fill="#E9F2F8" stroke="#17345F" stroke-width="2.5"/>
  <text x="918" y="373" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#1C3553">C function</text>
  <text x="918" y="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1C3553">linked into executable</text>

  <line x1="918" y1="422" x2="918" y2="480" stroke="#5E9F68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="823" y="483" width="190" height="68" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5"/>
  <text x="918" y="526" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="600" fill="#356943">Result</text>

  <!-- The linked executable becomes the running executable -->
  <line x1="439" y1="526" x2="682" y2="526" stroke="#526B82" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow-navy)"/>
  <text x="560" y="509" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#526B82">run</text>
</svg>
