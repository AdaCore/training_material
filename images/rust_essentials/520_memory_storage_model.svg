  <title id="title">Memory storage model</title>
  <desc id="desc">Conceptual storage regions: local arrays and FixedVec containers store their elements inline, a static item has program-duration storage, and a local Vec handle refers to a distinct heap-allocated element buffer. The precise machine placement of local values and the internal Vec field ordering are not specified by this drawing.</desc>
