<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Raw FFI and safe wrapper layers</title>
  <desc id="desc">Application code calls the Safe layer, where a safe wrapper enforces Rust invariants. A small reviewed unsafe operation enters the Raw layer, whose FFI declarations mirror the foreign header and connect to the native library.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="125" y="25" width="510" height="78" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="73" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#1C3553">Application code</text>
  <rect x="125" y="155" width="510" height="82" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="191" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#5E9F68">Safe layer</text>
  <text x="380" y="217" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#5E9F68">safe wrapper enforces Rust invariants</text>
  <rect x="125" y="300" width="510" height="82" rx="14" fill="#F8E8E4" stroke="#B54835" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="336" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#B54835">Raw layer</text>
  <text x="380" y="362" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B54835">FFI declarations mirror foreign header</text>
  <rect x="125" y="445" width="510" height="78" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="493" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#1C3553">Native library</text>
  <line x1="380" y1="103" x2="380" y2="155" stroke="#5E9F68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="452" y="111" width="220" height="36" rx="18" fill="#FFFFFF" stroke="#5E9F68" stroke-width="2"/><text x="562" y="134.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#5E9F68">safe Rust API</text>
  <line x1="380" y1="237" x2="380" y2="300" stroke="#B54835" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <rect x="442" y="247" width="335" height="44" rx="22.0" fill="#FFFFFF" stroke="#B54835" stroke-width="2"/><text x="609.5" y="275.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#B54835">small, reviewed unsafe operation</text>
  <line x1="380" y1="382" x2="380" y2="445" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="442" y="392" width="230" height="44" rx="22.0" fill="#FFFFFF" stroke="#17345F" stroke-width="2"/><text x="557.0" y="420.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#1C3553">platform C ABI</text>
  <text x="750" y="66" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#5E9F68">Ergonomic Rust types</text>
  <line x1="700" y1="47" x2="700" y2="226" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="47" x2="720" y2="47" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="226" x2="720" y2="226" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="349" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#B54835">Foreign ABI boundary</text>
  <line x1="700" y1="318" x2="700" y2="505" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="318" x2="720" y2="318" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="505" x2="720" y2="505" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
</svg>
