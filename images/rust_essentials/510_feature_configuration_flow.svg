<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Build configurations and available APIs</title>
  <desc id="desc">Three-row diagram mapping build selection to enabled features and available APIs, without column headings.</desc>
  <defs>
    <style>
      .boxtext { font: 700 52px 'DejaVu Sans', Arial, sans-serif; fill: #173a6a; }
      .arrow { stroke: #58708d; stroke-width: 8; fill: none; }
      .outline-blue-light { stroke: #b3d0e3; }
      .outline-gold { stroke: #d1a03a; }
      .outline-green { stroke: #5ca064; }
      .outline-blue-dark { stroke: #1f467c; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58708d"/>
    </marker>
  </defs>

  <!-- Transparent background on purpose -->

  <!-- left column -->
  <rect x="80" y="90"  width="400" height="110" rx="24" fill="#dfe9ef" class="outline-blue-light" stroke-width="4"/>
  <rect x="80" y="300" width="400" height="110" rx="24" fill="#dfe9ef" class="outline-blue-light" stroke-width="4"/>
  <rect x="80" y="510" width="400" height="110" rx="24" fill="#dfe9ef" class="outline-blue-light" stroke-width="4"/>

  <!-- middle column -->
  <rect x="620" y="90"  width="400" height="110" rx="24" fill="#efe4bb" class="outline-gold" stroke-width="4"/>
  <rect x="620" y="300" width="400" height="110" rx="24" fill="#d6dfd7" class="outline-green" stroke-width="4"/>
  <rect x="620" y="510" width="400" height="110" rx="24" fill="#d1e0ea" class="outline-blue-dark" stroke-width="4"/>

  <!-- right column -->
  <rect x="1160" y="90"  width="400" height="110" rx="24" fill="#efe4bb" class="outline-gold" stroke-width="4"/>
  <rect x="1160" y="300" width="400" height="110" rx="24" fill="#d6dfd7" class="outline-green" stroke-width="4"/>
  <rect x="1160" y="510" width="400" height="110" rx="24" fill="#d1e0ea" class="outline-blue-dark" stroke-width="4"/>

  <!-- arrows -->
  <line x1="500" y1="145" x2="595" y2="145" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="355" x2="595" y2="355" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="565" x2="595" y2="565" class="arrow" marker-end="url(#arrowhead)"/>

  <line x1="1040" y1="145" x2="1135" y2="145" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="1040" y1="355" x2="1135" y2="355" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="1040" y1="565" x2="1135" y2="565" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- text -->
  <text x="280" y="145" text-anchor="middle" dominant-baseline="middle" class="boxtext">Default</text>
  <text x="280" y="355" text-anchor="middle" dominant-baseline="middle" class="boxtext">Alloc only</text>
  <text x="280" y="565" text-anchor="middle" dominant-baseline="middle" class="boxtext">Core only</text>

  <text x="820" y="145" text-anchor="middle" dominant-baseline="middle" class="boxtext">std + alloc</text>
  <text x="820" y="355" text-anchor="middle" dominant-baseline="middle" class="boxtext">alloc</text>
  <text x="820" y="565" text-anchor="middle" dominant-baseline="middle" class="boxtext">none</text>

  <text x="1360" y="145" text-anchor="middle" dominant-baseline="middle" class="boxtext">All APIs</text>
  <text x="1360" y="355" text-anchor="middle" dominant-baseline="middle" class="boxtext">Core + alloc</text>
  <text x="1360" y="565" text-anchor="middle" dominant-baseline="middle" class="boxtext">Core only</text>
</svg>
