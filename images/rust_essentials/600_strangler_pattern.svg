<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="610" viewBox="0 0 1020 610" role="img" aria-labelledby="title desc">
  <title id="title">Branch by abstraction</title>
  <desc id="desc">Existing callers use a stable abstraction. Configuration routes calls to either the legacy component or the Rust component while both are checked against the same tests and evidence.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="360" y="20" width="300" height="66" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="510" y="60" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Existing callers</text>
  <line x1="510" y1="86" x2="510" y2="125" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="305" y="125" width="410" height="74" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="510" y="171" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#5E9F68">Stable abstraction</text>
  <line x1="410" y1="199" x2="280" y2="275" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <line x1="610" y1="199" x2="740" y2="275" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="425" y="211" width="170" height="44" rx="22.0" fill="#FFFFFF" stroke="#18A9C7" stroke-width="2"/><text x="510.0" y="239.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#18A9C7">configuration</text>
  <rect x="95" y="275" width="370" height="74" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="280" y="321" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Legacy component</text>
  <rect x="555" y="275" width="370" height="74" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="740" y="321" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Rust component</text>
  <line x1="280" y1="349" x2="410" y2="410" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <line x1="740" y1="349" x2="610" y2="410" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="320" y="410" width="380" height="66" rx="14" fill="#FFFFFF" stroke="#18A9C7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="510" y="450" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#18A9C7">Same tests and evidence</text>
  <line x1="185" y1="525" x2="835" y2="525" stroke="#B8D5E6" stroke-width="8" stroke-linecap="round"/>
  <line x1="185" y1="525" x2="680" y2="525" stroke="#5E9F68" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text x="185" y="570" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#526B82">Legacy</text>
  <text x="835" y="570" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#526B82">Rust</text>
  
</svg>
