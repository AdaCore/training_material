<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background card -->
  <rect width="900" height="390" rx="10" ry="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F8FAFC" letter-spacing="0.5">Nested Interrupts and Priorities Timeline</text>

  <!-- Track Labels (Left Side) -->
  <text x="40" y="105" font-family="monospace" font-weight="bold" font-size="13" fill="#38BDF8">FOREGROUND</text>
  <text x="40" y="122" font-family="sans-serif" font-size="10" fill="#64748B">Priority: Base (0)</text>

  <text x="40" y="185" font-family="monospace" font-weight="bold" font-size="13" fill="#FB923C">HANDLER A</text>
  <text x="40" y="202" font-family="sans-serif" font-size="10" fill="#64748B">Priority: Medium (1)</text>

  <text x="40" y="265" font-family="monospace" font-weight="bold" font-size="13" fill="#F87171">HANDLER B</text>
  <text x="40" y="282" font-family="sans-serif" font-size="10" fill="#64748B">Priority: High (2)</text>

  <!-- Track Baselines -->
  <line x1="200" y1="100" x2="840" y2="100" stroke="#1E293B" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="180" x2="840" y2="180" stroke="#1E293B" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="260" x2="840" y2="260" stroke="#1E293B" stroke-width="12" stroke-linecap="round" />

  <!-- 1. Foreground Runs (200 -> 320) -->
  <line x1="200" y1="100" x2="320" y2="100" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />

  <!-- Transition: Trigger ISR A (320) -->
  <line x1="320" y1="100" x2="320" y2="180" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Foreground Suspended (320 -> 760) -->
  <line x1="320" y1="100" x2="760" y2="100" stroke="#475569" stroke-width="3" stroke-dasharray="6,5" />

  <!-- 2. Handler A Runs (320 -> 460) -->
  <line x1="320" y1="180" x2="460" y2="180" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />

  <!-- Transition: High Priority Interrupt B preempts A (460) -->
  <line x1="460" y1="180" x2="460" y2="260" stroke="#F87171" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Handler A Suspended by B (460 -> 620) -->
  <line x1="460" y1="180" x2="620" y2="180" stroke="#475569" stroke-width="3" stroke-dasharray="6,5" />

  <!-- 3. Handler B Runs to Completion (460 -> 620) -->
  <line x1="460" y1="260" x2="620" y2="260" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />

  <!-- Transition: Return to Handler A (620) -->
  <line x1="620" y1="260" x2="620" y2="180" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- 4. Handler A Resumes & Finishes (620 -> 760) -->
  <line x1="620" y1="180" x2="760" y2="180" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />

  <!-- Transition: Return to Foreground (760) -->
  <line x1="760" y1="180" x2="760" y2="100" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- 5. Foreground Resumes (760 -> 830) -->
  <line x1="760" y1="100" x2="830" y2="100" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />

  <!-- Transition Points / Dots -->
  <circle cx="320" cy="100" r="5" fill="#FB923C" />
  <circle cx="320" cy="180" r="5" fill="#FB923C" />
  <circle cx="460" cy="180" r="5" fill="#EF4444" />
  <circle cx="460" cy="260" r="5" fill="#EF4444" />
  <circle cx="620" cy="260" r="5" fill="#FB923C" />
  <circle cx="620" cy="180" r="5" fill="#FB923C" />
  <circle cx="760" cy="180" r="5" fill="#38BDF8" />
  <circle cx="760" cy="100" r="5" fill="#38BDF8" />

  <!-- Event Labels -->
  <text x="317" y="145" text-anchor="end" dx="-8" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FB923C">ISR A fires</text>
  <text x="460" y="225" text-anchor="end" dx="-8" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F87171">ISR B preempts A</text>
  <text x="620" y="222" text-anchor="start" dx="8" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FB923C">ISR B returns</text>
  <text x="760" y="145" text-anchor="start" dx="8" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">All ISRs exit</text>

  <!-- Execution Block Labels -->
  <text x="540" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FCA5A5">Handler B executing</text>
  <text x="690" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FDBA74">Handler A resumes</text>

  <!-- Time Axis Bottom -->
  <line x1="200" y1="330" x2="830" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="840" y="334" font-family="sans-serif" font-size="11" fill="#64748B">Time</text>

  <line x1="320" y1="325" x2="320" y2="335" stroke="#64748B" stroke-width="1.5" />
  <text x="320" y="352" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">t1</text>

  <line x1="460" y1="325" x2="460" y2="335" stroke="#64748B" stroke-width="1.5" />
  <text x="460" y="352" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">t2</text>

  <line x1="620" y1="325" x2="620" y2="335" stroke="#64748B" stroke-width="1.5" />
  <text x="620" y="352" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">t3</text>

  <line x1="760" y1="325" x2="760" y2="335" stroke="#64748B" stroke-width="1.5" />
  <text x="760" y="352" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">t4</text>

</svg>