<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">Recommended bindgen workflow</title>
  <desc id="desc">Vendor headers are processed by bindgen into generated raw bindings. A hand-written safe wrapper exposes an ergonomic API to application code.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="120" y="35" width="520" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="86" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#1C3553">Vendor headers</text>
  <rect x="120" y="180" width="520" height="82" rx="14" fill="#E9F2F8" stroke="#18A9C7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="231" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#18A9C7">bindgen</text>
  <rect x="120" y="325" width="520" height="82" rx="14" fill="#F8E8E4" stroke="#B54835" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="376" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#B54835">Generated raw bindings</text>
  <rect x="120" y="470" width="520" height="82" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="521" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#5E9F68">Hand-written safe wrapper</text>
  <rect x="120" y="615" width="520" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="666" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#1C3553">Application code</text>
  <line x1="380" y1="117" x2="380" y2="180" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <line x1="380" y1="262" x2="380" y2="325" stroke="#B54835" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <line x1="380" y1="407" x2="380" y2="470" stroke="#5E9F68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <line x1="380" y1="552" x2="380" y2="615" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="675" y="191" width="245" height="48" rx="24.0" fill="#FFFFFF" stroke="#18A9C7" stroke-width="2"/><text x="797.5" y="221.48" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#18A9C7">code generation</text>
  <rect x="675" y="336" width="245" height="48" rx="24.0" fill="#FFFFFF" stroke="#B54835" stroke-width="2"/><text x="797.5" y="366.48" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#B54835">raw declarations</text>
  <rect x="675" y="481" width="245" height="48" rx="24.0" fill="#FFFFFF" stroke="#5E9F68" stroke-width="2"/><text x="797.5" y="511.48" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#5E9F68">reviewed safety</text>
</svg>
