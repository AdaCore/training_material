<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From source code to a foreign call</title>
  <desc id="desc">Rust source is compiled to object code, linked to a native library, and invokes a foreign implementation. The declaration contract specifies the symbol name, ABI, and types.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="55" y="145" width="210" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="160" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Rust source</text>
  <rect x="350" y="145" width="210" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="455" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Object code</text>
  <rect x="645" y="145" width="160" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="725" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1C3553">Linker</text>
  <rect x="850" y="145" width="280" height="82" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="990" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#1C3553">Native library</text>
  <line x1="265" y1="186" x2="350" y2="186" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="271" y="126" width="73" height="38" rx="19.0" fill="#FFFFFF" stroke="#18A9C7" stroke-width="2"/><text x="307.5" y="150.4" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#1C3553">compile</text>
  <line x1="560" y1="186" x2="645" y2="186" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <line x1="805" y1="186" x2="850" y2="186" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="235" y="35" width="700" height="54" rx="27.0" fill="#FFFFFF" stroke="#17345F" stroke-width="2"/><text x="585.0" y="69.92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#1C3553">Declaration contract: symbol name + ABI + types</text>
  <line x1="455" y1="89" x2="455" y2="137" stroke="#17345F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-navy)"/>
  <rect x="830" y="315" width="320" height="82" rx="14" fill="#E9F2F8" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="990" y="365" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#1C3553">Foreign implementation</text>
  <line x1="990" y1="227" x2="990" y2="315" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="860" y="475" width="260" height="82" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="990" y="525" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#356943">Result</text>
  <line x1="990" y1="397" x2="990" y2="475" stroke="#5E9F68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="55" y="305" width="735" height="68" rx="34.0" fill="#F8E8E4" stroke="#B54835" stroke-width="2"/><text x="422.5" y="345.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#B54835">Compiler checks the Rust declaration - not the foreign implementation</text>
</svg>
