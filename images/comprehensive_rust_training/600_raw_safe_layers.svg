<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
  <title id="title">Raw FFI and safe wrapper layers</title>
  <desc id="desc">Application code calls the Safe layer, implemented as a safe wrapper module. A small reviewed unsafe operation enters the Raw layer, which contains FFI declarations connected to the native library.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="125" y="45" width="510" height="92" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="101" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#1C3553">Application code</text>
  <rect x="125" y="210" width="510" height="92" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="252" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#5E9F68">Safe layer</text>
  <text x="380" y="279" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#5E9F68">safe wrapper module</text>
  <rect x="125" y="375" width="510" height="92" rx="14" fill="#F8E8E4" stroke="#B54835" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="417" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#B54835">Raw layer</text>
  <text x="380" y="444" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B54835">FFI declarations</text>
  <rect x="125" y="540" width="510" height="92" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="596" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#1C3553">Native library</text>
  <line x1="380" y1="137" x2="380" y2="210" stroke="#5E9F68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="442" y="150" width="260" height="44" rx="22.0" fill="#FFFFFF" stroke="#5E9F68" stroke-width="2"/><text x="572.0" y="178.48" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#5E9F68">safe Rust API</text>
  <line x1="380" y1="302" x2="380" y2="375" stroke="#B54835" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <rect x="442" y="315" width="335" height="44" rx="22.0" fill="#FFFFFF" stroke="#B54835" stroke-width="2"/><text x="609.5" y="343.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#B54835">small, reviewed unsafe operation</text>
  <line x1="380" y1="467" x2="380" y2="540" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="442" y="480" width="230" height="44" rx="22.0" fill="#FFFFFF" stroke="#17345F" stroke-width="2"/><text x="557.0" y="508.12" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#1C3553">C-compatible ABI</text>
  <text x="750" y="98" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#5E9F68">Ergonomic Rust types</text>
  <line x1="700" y1="75" x2="700" y2="275" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="75" x2="720" y2="75" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="275" x2="720" y2="275" stroke="#5E9F68" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="430" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#B54835">Exact foreign contract</text>
  <line x1="700" y1="393" x2="700" y2="610" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="393" x2="720" y2="393" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="610" x2="720" y2="610" stroke="#B54835" stroke-width="3" stroke-linecap="round"/>
</svg>
