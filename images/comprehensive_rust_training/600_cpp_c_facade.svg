<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
  <title id="title">Default C++ interoperability strategy</title>
  <desc id="desc">Rust calls a C-compatible wrapper through a stable C ABI. The wrapper makes normal C++ calls and hides C++-specific types and exception behavior.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17345F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18A9C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E9F68"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B54835"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="140" y="45" width="520" height="92" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="400" y="102" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#1C3553">Rust</text>
  <rect x="140" y="260" width="520" height="92" rx="14" fill="#E8F4EA" stroke="#5E9F68" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="400" y="317" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#5E9F68">C-compatible wrapper</text>
  <rect x="140" y="475" width="520" height="92" rx="14" fill="#D7E8F2" stroke="#17345F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="400" y="532" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#1C3553">C++ implementation</text>
  <line x1="400" y1="137" x2="400" y2="260" stroke="#18A9C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="465" y="170" width="230" height="48" rx="24.0" fill="#FFFFFF" stroke="#18A9C7" stroke-width="2"/><text x="580.0" y="200.84" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#18A9C7">stable C ABI</text>
  <line x1="400" y1="352" x2="400" y2="475" stroke="#17345F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="465" y="385" width="255" height="48" rx="24.0" fill="#FFFFFF" stroke="#17345F" stroke-width="2"/><text x="592.5" y="415.84" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#1C3553">normal C++ calls</text>
  <rect x="760" y="110" width="390" height="420" rx="18" fill="#FFFFFF" stroke="#B8D5E6" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="160" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#1C3553">C facade responsibilities</text>

  <circle cx="805" cy="225" r="8" fill="#18A9C7"/>
  <text x="835" y="233" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#1C3553">C linkage + C types</text>

  <circle cx="805" cy="305" r="8" fill="#18A9C7"/>
  <text x="835" y="313" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#1C3553">Catch C++ exceptions</text>

  <circle cx="805" cy="385" r="8" fill="#18A9C7"/>
  <text x="835" y="393" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#1C3553">Hide classes/templates</text>

  <circle cx="805" cy="465" r="8" fill="#18A9C7"/>
  <text x="835" y="473" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#1C3553">Handles + create/destroy</text>
</svg>
